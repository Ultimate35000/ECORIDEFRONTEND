<div class="container">
    <div class="form-container">
        <form>
            <h3 class="text-center mb-4">Connexion</h3>
            <div class="mb-3">
                <label for="EmailInput" class="form-label">Email</label>
                <input type="email" class="form-control" id="EmailInput" placeholder="johndoe@mail.fr" name="Email">
            </div>
            <div class="mb-3">
                <label for="PasswordInput" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="PasswordInput" placeholder="Mot de passe" name="Password">
            </div>
            <button type="submit" class="btn btn-primary">Connexion</button>
        </form>
        <div class="text-center pt-3">
            <a href="/signup" class="signup-link">Vous n’avez pas de compte ? Inscrivez-vous ici !</a>
        </div>
    </div>
</div>
