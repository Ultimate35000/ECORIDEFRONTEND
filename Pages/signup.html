<div class="form-container">
    <form>
        <h3 class="text-center mb-4">Inscription</h3>
        <div class="mb-3">
            <label for="Pseudo" class="form-label">Pseudo</label>
            <input type="Pseudo" class="form-control" id="Pseudo" placeholder="Votre pseudo" name="Pseudo">
        </div>
        <div class="mb-3">
            <label for="EmailInput" class="form-label">Email</label>
            <input type="email" class="form-control" id="EmailInput" placeholder="johndoe@mail.fr" name="Email">
        </div>
        <div class="mb-3">
            <label for="PasswordInput" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="PasswordInput" name="Password">
        </div>
        <div class="mb-3">
            <label for="ValidatePasswordInput" class="form-label">Validez votre mot de passe</label>
            <input type="password" class="form-control" id="ValidatePasswordInput" name="PasswordConfirm">
          </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Inscription</button>
        </div>
    </form>
    <div class="text-center pt-3">
        <a href="/connexion">Vous avez déjà un compte ? Connectez-vous ici !</a>
    </div>
    </form>
</div>
